name: release

on:
    push:
        tags: ["v*"]

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                arch: [amd64, arm64]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod

            - name: Build
              env:
                  GOARCH: ${{ matrix.arch }}
                  CGO_ENABLED: "0"
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  go build -trimpath -ldflags "-s -w -X main.cliVersion=${VERSION}" \
                    -o "oma-${GITHUB_REF_NAME}-linux-${GOARCH}" .

            - name: Package
              run: |
                  DIR="oma-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}"
                  mkdir -p "dist/${DIR}"
                  cp "oma-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}" "dist/${DIR}/oma"
                  cp README.md "dist/${DIR}/" 2>/dev/null || true
                  tar -czf "dist/${DIR}.tar.gz" -C dist "${DIR}"

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: tarball-${{ matrix.arch }}
                  path: dist/*.tar.gz
                  if-no-files-found: error

    # Checksums must cover BOTH tarballs in one file: running sha256sum per
    # matrix job made each arch publish its own one-line file (last write
    # won), which broke install.sh's verification for the other arch.
    release:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v8
              with:
                  path: dist
                  merge-multiple: true

            - name: Checksums
              run: |
                  cd dist
                  sha256sum *.tar.gz > sha256sums.txt
                  cat sha256sums.txt

            - name: Publish
              uses: softprops/action-gh-release@v3
              with:
                  files: |
                      dist/*.tar.gz
                      dist/sha256sums.txt
                  generate_release_notes: true

    # Publishes @oma/runtime (the plugin runtime lib) to jsr.io. Provenance
    # requires tokenless OIDC publishing from Actions — do not add a --token
    # fallback. One-time setup: link the package to this repository in the
    # jsr.io package settings ("GitHub Repository" field).
    publish-jsr:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v7

            - name: Stage package (assets/oma.js is the single source of truth)
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  cp assets/oma.js assets/oma.d.ts jsr/
                  cp LICENSE jsr/LICENSE
                  sed -i "s/\"version\": \"0.0.0-dev\"/\"version\": \"${VERSION}\"/" jsr/jsr.json
                  grep -q "\"version\": \"${VERSION}\"" jsr/jsr.json

            - name: Byte-match assertion (published lib == embedded asset)
              run: cmp assets/oma.js jsr/oma.js

            - name: Dry run
              working-directory: jsr
              # --allow-dirty: the sed above modifies jsr.json in the work
              # tree, and jsr publish aborts on uncommitted changes
              run: npx jsr publish --dry-run --allow-dirty

            - name: Publish
              working-directory: jsr
              run: npx jsr publish --allow-dirty

    # Keeps packaging/aur/PKGBUILD current: pkgver + checksums straight from
    # the release's sha256sums.txt, committed only when something changed.
    # The GITHUB_TOKEN push does not re-trigger workflows, so no loop.
    bump-pkgbuild:
        needs: release
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Update packaging/aur/PKGBUILD
              run: bash scripts/bump-pkgbuild.sh "${GITHUB_REF_NAME#v}"

            - name: Commit when changed
              run: |
                  if git diff --quiet packaging/aur/PKGBUILD; then
                    echo "no changes"
                  else
                    git config user.name "oma-bot"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add packaging/aur/PKGBUILD
                    git commit -m "chore: bump AUR PKGBUILD to ${GITHUB_REF_NAME}"
                    git push
                  fi
